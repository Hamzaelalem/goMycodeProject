# Local PostgreSQL for Decision Layer Dashboard (dev only).
# Start: docker compose up -d
# Stop:  docker compose down
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: decisionlayer
      POSTGRES_PASSWORD: dev_local_change_me
      POSTGRES_DB: client_ecc
    ports:
      - "5433:5432"
    volumes:
      - decision_layer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionlayer -d client_ecc"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  decision_layer_pg:
